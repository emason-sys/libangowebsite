name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token — the workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Prefer the locked install; fall back until the first `npm install`
      # generates and commits `package-lock.json` (see docs/runbooks).
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Dependency audit (fail on high or critical)
        # `--omit=dev` scopes the audit to what actually ships in production;
        # dev-only vulns are still worth watching but not release-blocking here.
        run: npm audit --omit=dev --audit-level=high

      - name: Build (includes TypeScript type-checking)
        run: npm run build

  # Deploy job intentionally absent until Phase 3 confirms the hosting path.
  # Target: SSH deploy to the OCI instance via scoped GitHub Actions secrets
  # (SSH_PRIVATE_KEY, SSH_HOST). Wired after the Nginx + systemd path exists.
