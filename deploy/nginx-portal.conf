# Portal reverse proxy — devportal.libangolr.net
#
# Fronts the vendor-facing backend UI at 10.0.1.177:3001 (a Next.js app on a
# separate OCI host, reached via the private VCN). Both this site and the
# backend serve their assets under /_next/*, which is why we cannot mount the
# proxy under a subpath of devsite.libangolr.net — the asset namespaces would
# collide. A dedicated subdomain gives each Next.js app its own root.
#
# Gate flow:
#   1. Client hits any protected path (default: everything except /gate and
#      /api/portal/*).
#   2. nginx runs `auth_request /_portal_check` which forwards the client's
#      Cookie to our public site's /api/portal/check endpoint on 127.0.0.1:3000.
#   3. Missing/invalid cookie -> 401 -> error_page redirects to /gate?next=<uri>.
#   4. /gate renders the Turnstile widget; on success it POSTs to
#      /api/portal/verify, which validates against Cloudflare siteverify and
#      sets the signed libango_portal cookie.
#   5. Subsequent requests carry the cookie -> auth_request returns 200 ->
#      proxy_pass to the backend at 10.0.1.177:3001.
#
# See ADR 0013 for the design rationale.

server {
  listen 80;
  listen [::]:80;
  server_name devportal.libangolr.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name devportal.libangolr.net;

  ssl_certificate     /etc/letsencrypt/live/devportal.libangolr.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/devportal.libangolr.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;

  # Security headers — same set as devsite, matched for consistency.
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  # Dev host — not indexable, same as devsite.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Vendor applications can include a PDF/JPG upload; match the devsite cap.
  client_max_body_size 12M;

  # --- Gate page and portal APIs served by our Next.js app on 127.0.0.1:3000 ---
  # These MUST NOT be gated (they are the gate).
  location = /gate {
    proxy_pass http://127.0.0.1:3000/gate;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/portal/ {
    proxy_pass http://127.0.0.1:3000/api/portal/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Our public site's own asset chunks that /gate needs (fonts, CSS, JS bundles).
  # They live on 127.0.0.1:3000 and are ungated for the same reason as /gate.
  location /_next/ {
    # Route _next/ requests to whichever origin is serving the current page.
    # For /gate we need our Next.js; for the backend UI we need 10.0.1.177.
    # We can't tell here without a cookie/referer, but the Cloudflare Turnstile
    # widget itself pulls from challenges.cloudflare.com (external), and both
    # Next.js apps happen to use hash-suffixed chunk filenames. So we route
    # by presence of the portal cookie: valid cookie -> backend, otherwise -> us.
    auth_request /_portal_check;
    error_page 401 = @portal_next_ours;
    proxy_pass http://10.0.1.177:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location @portal_next_ours {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Everything else: gated by the portal cookie, proxied to the backend ---
  location / {
    auth_request /_portal_check;
    error_page 401 = @portal_gate;

    proxy_pass http://10.0.1.177:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location @portal_gate {
    # Send unverified visitors to the gate with their intended destination
    # captured. `next` is sanitized server-side before use.
    return 302 /gate?next=$request_uri;
  }

  # --- Internal auth_request endpoint (not reachable from the client) ---
  location = /_portal_check {
    internal;
    proxy_pass http://127.0.0.1:3000/api/portal/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
    # Short timeout — this is a hot path on every proxied request.
    proxy_read_timeout 3s;
    proxy_connect_timeout 2s;
  }
}
