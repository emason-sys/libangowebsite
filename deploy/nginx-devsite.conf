server {
  listen 80;
  listen [::]:80;
  server_name devsite.libangolr.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name devsite.libangolr.net;

  ssl_certificate     /etc/letsencrypt/live/devsite.libangolr.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/devsite.libangolr.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  # Dev host: not indexable (paired with public/robots.txt)
  add_header X-Robots-Tag "noindex, nofollow" always;

  client_max_body_size 12M;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
